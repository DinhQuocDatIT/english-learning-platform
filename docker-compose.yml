services:
  mysql:
    image: mysql:8.0
    container_name: english-learning-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: english_learning
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
